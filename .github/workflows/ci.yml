name: Backend release gates
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_ENV: test
  APP_DEBUG: "false"
  OTP_DEBUG_EXPOSE_CODE: "false"
  JWT_SECRET: ci-test-only-jwt-signing-not-a-production-secret-2026
  OTP_PEPPER: ci-test-only-otp-pepper-not-a-production-secret-2026
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q app tests scripts
      - run: pytest -m "not integration"
      - run: python scripts/export_openapi.py --check
      - run: python scripts/release_check.py
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: restaurant_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restaurant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-test-only-password@127.0.0.1:5432/restaurant_test
      REQUIRE_POSTGRES_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: pytest -m integration -rP
