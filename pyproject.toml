[project]
name = "restaurant-app-backend"
version = "0.1.0"
description = "Restaurant App Backend foundation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error"]
markers = [
    "integration: PostgreSQL tests, opt-in with pytest -m integration and TEST_DATABASE_URL",
    "e2e: cross-slice backend flows (integration when PostgreSQL is required)",
    "performance: bounded query counts/plans, never a wall-clock SLA gate",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
